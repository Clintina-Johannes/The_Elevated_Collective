<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Croissant -->
    <g id="croissant">
      <path d="M0 14 C 6 -6, 26 -6, 32 14 C 26 8, 20 8, 16 14 C 12 8, 6 8, 0 14 Z"
            fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Macaron -->
    <g id="macaron">
      <ellipse cx="12" cy="6" rx="11" ry="5.5" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <rect x="1.5" y="6" width="21" height="4.5" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <ellipse cx="12" cy="15" rx="11" ry="5.5" fill="none" stroke="currentColor" stroke-width="2.4"/>
    </g>
    <!-- Pretzel -->
    <g id="pretzel">
      <path d="M14 2 C 22 2, 26 10, 20 14 C 26 14, 26 24, 18 24 C 14 24, 14 18, 18 16
               C 10 16, 10 24, 2 24 C -6 24, -6 14, 2 14 C -4 10, 0 2, 8 2 C 10 2, 12 2, 14 2 Z"
            fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Cupcake -->
    <g id="cupcake">
      <path d="M2 10 L4 22 L18 22 L20 10 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M2 10 C 2 4, 8 -2, 11 4 C 14 -2, 20 4, 20 10 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="11" cy="-3" r="2" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>
    <!-- Cookie with chips -->
    <g id="cookie">
      <circle cx="10" cy="10" r="10" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <circle cx="6" cy="7" r="1.4" fill="currentColor"/>
      <circle cx="13" cy="6" r="1.4" fill="currentColor"/>
      <circle cx="14" cy="13" r="1.4" fill="currentColor"/>
      <circle cx="7" cy="14" r="1.4" fill="currentColor"/>
    </g>
  </defs>

  <!-- Scattered pastry motifs — low-opacity, brand palette, tileable field -->
  <g opacity="0.55">
    <use href="#croissant" x="28"  y="40"  color="#2D6A4F" transform="rotate(-8 44 56)"/>
    <use href="#macaron"   x="140" y="18"  color="#BA181B"/>
    <use href="#pretzel"   x="230" y="60"  color="#2D6A4F" transform="scale(0.85)"/>
    <use href="#cupcake"   x="330" y="30"  color="#BA181B" transform="scale(0.9)"/>
    <use href="#cookie"    x="410" y="70"  color="#2D6A4F"/>

    <use href="#macaron"   x="20"  y="150" color="#2D6A4F" transform="scale(0.9) rotate(6 12 12)"/>
    <use href="#cookie"    x="120" y="140" color="#BA181B" transform="scale(0.75)"/>
    <use href="#croissant" x="200" y="170" color="#BA181B" transform="rotate(10 16 14)"/>
    <use href="#cupcake"   x="290" y="150" color="#2D6A4F"/>
    <use href="#pretzel"   x="390" y="180" color="#BA181B" transform="scale(0.7)"/>

    <use href="#cookie"    x="40"  y="260" color="#BA181B" transform="scale(0.85)"/>
    <use href="#croissant" x="150" y="280" color="#2D6A4F" transform="rotate(-14 16 14)"/>
    <use href="#macaron"   x="250" y="260" color="#BA181B" transform="scale(0.8)"/>
    <use href="#pretzel"   x="340" y="290" color="#2D6A4F"/>
    <use href="#cupcake"   x="10"  y="360" color="#2D6A4F" transform="scale(0.8)"/>

    <use href="#pretzel"   x="110" y="380" color="#BA181B" transform="scale(0.9) rotate(8 14 14)"/>
    <use href="#cookie"    x="220" y="370" color="#2D6A4F"/>
    <use href="#croissant" x="320" y="400" color="#BA181B" transform="rotate(4 16 14)"/>
    <use href="#macaron"   x="420" y="370" color="#2D6A4F" transform="scale(0.85)"/>
  </g>
</svg>
