<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="auto" role="img" aria-labelledby="wm-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="wm-title">The Elevated Collective — bakery-lettered wordmark with pastry ornaments</title>
  <defs>
    <linearGradient id="wm-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0E0E0"/>
    </linearGradient>
  </defs>

  <!-- Baseline wordmark -->
  <text x="450" y="118" text-anchor="middle"
        font-family="Montserrat, sans-serif" font-weight="900"
        font-size="64" letter-spacing="2" fill="url(#wm-fade)">
    ELEVATED
  </text>
  <text x="450" y="176" text-anchor="middle"
        font-family="Montserrat, sans-serif" font-weight="700"
        font-size="30" letter-spacing="10" fill="#BA181B">
    COLLECTIVE
  </text>

  <!-- Pastry ornaments "baking" into the lettering -->
  <g stroke="#2D6A4F" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- croissant over the "E" -->
    <path d="M40 60 C 48 34, 76 34, 84 60 C 76 52, 68 52, 62 60 C 56 52, 48 52, 40 60 Z" transform="translate(20,10)"/>
    <!-- pretzel trailing after "D" -->
    <path d="M770 46 C 782 46, 788 58, 778 64 C 788 64, 788 78, 776 78 C 770 78, 770 70, 776 66
             C 764 66, 764 78, 752 78 C 740 78, 740 64, 752 64 C 742 58, 748 46, 760 46 C 764 46, 768 46, 770 46 Z"/>
  </g>
  <g stroke="#BA181B" stroke-width="2.4" fill="none">
    <!-- macaron near "V" -->
    <ellipse cx="470" cy="46" rx="16" ry="8"/>
    <rect x="454" y="46" width="32" height="7"/>
    <ellipse cx="470" cy="60" rx="16" ry="8"/>
  </g>
  <g stroke="#2D6A4F" stroke-width="2.4" fill="none">
    <!-- cookie under "COLLECTIVE" -->
    <circle cx="300" cy="195" r="13"/>
    <circle cx="296" cy="191" r="1.6" fill="#2D6A4F"/>
    <circle cx="305" cy="192" r="1.6" fill="#2D6A4F"/>
    <circle cx="303" cy="199" r="1.6" fill="#2D6A4F"/>
    <circle cx="297" cy="200" r="1.6" fill="#2D6A4F"/>
  </g>
  <g stroke="#BA181B" stroke-width="2.4" fill="none">
    <!-- cupcake trailing collective -->
    <path d="M588 188 L591 208 L621 208 L624 188 Z"/>
    <path d="M588 188 C 588 176, 600 164, 606 176 C 612 164, 624 176, 624 188 Z"/>
  </g>
</svg>
